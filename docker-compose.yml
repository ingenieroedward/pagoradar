# Dokploy: crea una app "Docker Compose" apuntando a este repo, agrega el dominio hacia el
# servicio "pagoradar", puerto 3000, y pon las variables en Environment (ver .env.example).
services:
  pagoradar:
    build: .
    restart: unless-stopped
    environment:
      INGEST_SECRET: ${INGEST_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-180}
      # Configuración antigua: se importa una sola vez a la base de datos; después se puede quitar.
      PAGORADAR_SOURCES: ${PAGORADAR_SOURCES:-[]}
    volumes:
      - pagoradar-data:/app/data
    expose:
      - "3000"

volumes:
  # Nombre fijo: el mismo volumen aunque Dokploy cambie el nombre del proyecto al redesplegar.
  pagoradar-data:
    name: pagoradar-data
