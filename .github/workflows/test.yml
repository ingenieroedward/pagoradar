name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same Node major as the Dockerfile (node:22-alpine).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The real image: it has to build and start, not only pass the tests.
      - run: docker build -t pagoradar .
      - name: The container starts and answers /health
        run: |
          docker run -d --name pagoradar -p 3000:3000 -e INGEST_SECRET=$(openssl rand -hex 32) -e MASTER_KEY=$(openssl rand -hex 32) pagoradar
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 2; done
          docker logs pagoradar
          exit 1
      - name: The image serves the Worker's code
        run: curl -fsS http://127.0.0.1:3000/static/pagoradar-email-worker.js | grep -q X-Pagoradar-Signature
